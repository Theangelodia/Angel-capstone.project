
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover and book upcoming gospel concerts in Lagos.">
  <title>Gospel Events | Discover & Book</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/pages/home.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">Gospel Events</a>
    <nav aria-label="Main navigation">
      <a href="./index.html">Explore Events</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">FAITH • MUSIC • COMMUNITY</p>
      <h1>Find your next <span>gospel experience.</span></h1>
      <p>Discover upcoming gospel concerts and book your tickets.</p>
    </section>

    <section class="events-section" aria-labelledby="events-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">WHAT'S HAPPENING</p>
          <h2 id="events-heading">Explore events</h2>
        </div>
        <p id="event-count" aria-live="polite"></p>
      </div>

      <form id="filter-form" class="filter-panel">
        <div class="form-field">
          <label for="search">Search events</label>
          <input
            id="search"
            name="q"
            type="search"
            placeholder="Search by event or venue"
          >
        </div>

        <div class="form-field">
          <label for="city">City</label>
          <select id="city" name="city">
            <option value="">All cities</option>
            <option value="Lagos">Lagos</option>
          </select>
        </div>

        <div class="form-field">
          <label for="max-price">Maximum ticket price (₦)</label>
          <input
            id="max-price"
            name="maxPrice"
            type="number"
            min="0"
            step="1"
            placeholder="Any price"
          >
        </div>

        <div class="form-field">
          <label for="sort">Sort events by</label>
          <select id="sort" name="sort">
            <option value="date">Date</option>
            <option value="price">Lowest price</option>
            <option value="availability">Most available tickets</option>
          </select>
        </div>

        <div class="filter-actions">
          <label class="availability-option" for="available">
            <input id="available" name="onlyAvailable" type="checkbox">
            Available tickets only
          </label>
          <button type="submit" class="primary-button">Apply filters</button>
          <button type="reset" id="reset-filters" class="secondary-button">Reset</button>
        </div>
      </form>

      <div id="events-list" class="events-grid" aria-live="polite">
        <p>Loading events...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Discover meaningful moments through gospel music.</p>
  </footer>
</body>
</html>
