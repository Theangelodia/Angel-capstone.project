
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View event details and choose your tickets.">
  <title>Event Details | Gospel Events</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/pages/event.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">Gospel Events</a>
    <nav aria-label="Main navigation">
      <a href="./index.html">Explore Events</a>
    </nav>
  </header>

  <main class="event-page">
    <a class="back-link" href="./index.html">← Back to events</a>

    <section id="event-details" aria-live="polite">
      <p>Loading event details...</p>
    </section>

    <section id="ticket-section" aria-labelledby="ticket-heading">
      <h2 id="ticket-heading">Choose your tickets</h2>
      <div id="ticket-list"></div>
    </section>

    <section id="checkout-section" aria-labelledby="checkout-heading" hidden>
      <h2 id="checkout-heading">Your booking</h2>
      <div id="checkout-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Discover meaningful moments through gospel music.</p>
  </footer>
</body>
</html>
